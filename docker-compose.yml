services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "9999:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - web-app-1
      - web-app-2
    networks:
      - sso-network

  web-app-1:
    build: ./web-app-1
    container_name: app1-service
    ports:
      - "5000:5000"
    environment:
      DB_PATH: /data/web-app-1.db
    volumes:
      - ./database/web-app-1.db:/data/web-app-1.db
    networks:
      - sso-network

  web-app-2:
    build: ./web-app-2
    container_name: app2-service
    ports:
      - "5001:5001"
    environment:
      DB_PATH: /data/web-app-2.db
    volumes:
      - ./database/web-app-2.db:/data/web-app-2.db
    networks:
      - sso-network

  radius:
    build:
      context: ./radius
      dockerfile: Dockerfile
    container_name: sso-radius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./radius/config/radiusd.conf:/etc/raddb/radiusd.conf:ro
      - ./radius/config/clients.conf:/etc/raddb/clients.conf:ro
      - ./radius/config/users:/etc/raddb/users:ro
      - ./radius/config/ldap.conf:/etc/raddb/ldap.conf:ro
    networks:
      - sso-network

  ldap:
    image: osixia/openldap:latest
    container_name: sso-ldap
    restart: unless-stopped
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ORGANISATION: "SSO Organization"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin_password"
      LDAP_CONFIG_PASSWORD: "config_password"
      LDAP_TLS: "false"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonly_password"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks:
      - sso-network

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: sso-ldap-admin
    restart: unless-stopped
    ports:
      - "8443:443"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap"
    depends_on:
      - ldap
    networks:
      - sso-network

networks:
  sso-network:
    driver: bridge

volumes:
  ldap-data:
    driver: local
  ldap-config:
    driver: local
