services:
  # ==========================================
  # Layer 3: FreeRADIUS Service
  # ==========================================
  radius:
    build:
      context: ./radius
      dockerfile: Dockerfile
    container_name: sso-radius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./radius/config/radiusd.conf:/etc/raddb/radiusd.conf:ro
      - ./radius/config/clients.conf:/etc/raddb/clients.conf:ro
      - ./radius/config/users:/etc/raddb/users:ro
      - ./radius/config/sql.conf:/etc/raddb/sql.conf:ro
    depends_on:
      - postgres
    networks:
      - sso-net

  # ==========================================
  # Layer 1: PostgreSQL Database (Replaces LDAP)
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: sso-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: radius_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./radtest/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sso-net

  # ==========================================
  # Layer 2: Database Web UI (pgAdmin4)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sso-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    volumes:
      - ./radtest/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - sso-net

networks:
  sso-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
