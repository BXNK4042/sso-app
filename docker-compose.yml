services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "9999:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - central-auth
      - web-app-1
      - web-app-2
    networks:
      - sso-network

  central-auth:
    build: ./central-auth
    container_name: central-auth
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      RADIUS_HOST: radius
      RADIUS_SECRET: ${RADIUS_SECRET:-sso_secret_123}
      JWT_SECRET: ${JWT_SECRET:-super-secure-jwt-sso-secret-key-2026}
      COOKIE_NAME: sso_token
      ADMIN_USERS: ${ADMIN_USERS:-admin,teacher01}
    depends_on:
      - radius
    networks:
      - sso-network

  web-app-1:
    build: ./web-app-1
    container_name: app1-service
    ports:
      - "5000:5000"
    environment:
      AUTH_SERVICE_URL: http://central-auth:4000/auth/login
      DB_PATH: /data/web-app-1.db
      JWT_SECRET: ${JWT_SECRET:-super-secure-jwt-sso-secret-key-2026}
      COOKIE_NAME: sso_token
    volumes:
      - ./database/web-app-1.db:/data/web-app-1.db
    depends_on:
      - central-auth
    networks:
      - sso-network

  web-app-2:
    build: ./web-app-2
    container_name: app2-service
    ports:
      - "5001:5001"
    environment:
      AUTH_SERVICE_URL: http://central-auth:4000/auth/login
      DB_PATH: /data/web-app-2.db
      JWT_SECRET: ${JWT_SECRET:-super-secure-jwt-sso-secret-key-2026}
      COOKIE_NAME: sso_token
    volumes:
      - ./database/web-app-2.db:/data/web-app-2.db
    depends_on:
      - central-auth
    networks:
      - sso-network

  radius:
    build:
      context: ./radius
      dockerfile: Dockerfile
    container_name: sso-radius
    restart: unless-stopped
    ports:
      - "127.0.0.1:1812:1812/udp"
      - "127.0.0.1:1813:1813/udp"
    volumes:
      - ./radius/config/radiusd.conf:/etc/raddb/radiusd.conf:ro
      - ./radius/config/clients.conf:/etc/raddb/clients.conf:ro
      - ./radius/config/users:/etc/raddb/users:ro
      - ./radius/config/sql.conf:/etc/raddb/sql.conf:ro
    depends_on:
      - postgres
    networks:
      - sso-network

  postgres:
    image: postgres:17-alpine
    container_name: sso-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: radius_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sso-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sso-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    volumes:
      - ./radtest/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - sso-network

networks:
  sso-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
