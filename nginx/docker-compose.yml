services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "9999:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - sso-network

  app1:
    build: ./app1
    container_name: app1-service
    ports:
      - "5000:5000"
    networks:
      - sso-network

  app2:
    build: ./app2
    container_name: app2-service
    ports:
      - "5001:5001"
    networks:
      - sso-network

networks:
  sso-network:
    driver: bridge