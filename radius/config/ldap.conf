# LDAP Authentication Module Configuration
# Connects FreeRADIUS to OpenLDAP for centralized user authentication

ldap {
    # LDAP Server connection
    server = "ldap"
    port = 389
    identity = "cn=admin,dc=example,dc=com"
    password = "admin_password"
    
    # Base DN for user searches
    base_dn = "dc=example,dc=com"
    
    # User search filter - searches for users by uid attribute
    # Customize this to match your LDAP schema
    filter = "(uid=%{Stripped-User-Name:-%{User-Name}})"
    
    # Timeout for LDAP operations
    timeout = 10
    
    # Use TLS for secure connection (optional - disable for plain LDAP)
    # use_tls = yes
    # tls_ca_file = /etc/raddb/certs/ca.pem
    
    # User password attribute in LDAP
    password_attribute = "userPassword"
    
    # Connection pooling
    pool {
        start = 5
        min = 3
        max = 10
        spare = 3
        lifetime = 600
        idle_timeout = 60
    }
}
