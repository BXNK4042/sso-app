prefix = /usr
sysconfdir = /etc
raddbdir = ${sysconfdir}/raddb

log {
    destination = stdout
}

security {
    max_request_time = 30
}

modules {
    pap {
    }
    files {
        filename = ${raddbdir}/users
    }

    # Load PostgreSQL SQL module
    $INCLUDE sql.conf
}

server default {
    listen {
        type = auth
        ipaddr = *
        port = 1812
    }
    listen {
        type = acct
        ipaddr = *
        port = 1813
    }

    authorize {
        files
        sql
        pap
    }

    authenticate {
        pap
    }

    post-auth {
        Post-Auth-Type Reject {
            update reply {
                Reply-Message := "Authentication failed"
            }
        }
    }
}

$INCLUDE clients.conf
