# FreeRADIUS Simple PostgreSQL Configuration

sql {
    driver = "rlm_sql_postgresql"
    dialect = "postgresql"

    # Database connection settings
    server = "postgres"
    port = 5432
    login = "radius"
    password = "radius_password"
    radius_db = "radius"
    sql_user_name = "%{User-Name}"

    # Disable complex group & client lookups
    read_groups = no
    read_profiles = no
    read_clients = no

    pool {
        start = 5
        min = 3
        max = 10
        spare = 3
        lifetime = 600
        idle_timeout = 60
    }

    # Query simple 'users' table directly (%% escapes % in FreeRADIUS)
    authorize_check_query = "SELECT id, username, CASE WHEN password LIKE '$%%' THEN 'Crypt-Password' ELSE 'Cleartext-Password' END AS attribute, password AS value, ':=' AS op FROM users WHERE username = '%{SQL-User-Name}'"
}
