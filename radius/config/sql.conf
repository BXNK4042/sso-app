# FreeRADIUS PostgreSQL Module Configuration

sql {
    driver = "rlm_sql_postgresql"
    dialect = "postgresql"

    # PostgreSQL Database Connection
    server = "postgres"
    port = 5432
    login = "radius"
    password = "radius_password"
    radius_db = "radius"
    sql_user_name = "%{User-Name}"

    # Disable group and profile lookups for simplicity
    read_groups = no
    read_profiles = no

    # Connection pool configuration
    pool {
        start = 5
        min = 3
        max = 10
        spare = 3
        lifetime = 600
        idle_timeout = 60
    }

    # Enable reading NAS clients dynamically from PostgreSQL table
    read_clients = yes
    client_table = "nas"

    # Authorization Queries
    authorize_check_query = "SELECT id, username, attribute, value, op FROM radcheck WHERE username = '%{SQL-User-Name}' ORDER BY id"
    authorize_reply_query = "SELECT id, username, attribute, value, op FROM radreply WHERE username = '%{SQL-User-Name}' ORDER BY id"
    client_query = "SELECT id, nasname, shortname, type, secret, server, community, description FROM nas"
}
